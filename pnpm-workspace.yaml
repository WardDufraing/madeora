packages:
  - apps/*
  - packages/*
  - tests/e2e
  - tests/db
  - tools/*

# Only these dependencies may run install scripts.
onlyBuiltDependencies:
  - sharp

# next-intl's sibling packages are released together; keep them on the same version as next-intl
# (4.14.7) instead of letting its ^ ranges pull newer, younger releases.
overrides:
  use-intl: 4.14.7
  icu-minify: 4.14.7
  # S13: @trigger.dev/core 4.6.4 → socket.io-client 4.7.5 → engine.io-client 6.5.4 pins ws ~8.17.1,
  # which has GHSA-96hv-2xvq-fx4p (high) and GHSA-58qx-3vcg-4xpx. Same major version; current
  # engine.io-client releases use ~8.21.0 themselves. Remove once the SDK no longer pulls it in.
  engine.io-client>ws: 8.21.3
  # 2026-10-27: jsdom (test-only DOM for Vitest) pulls undici 8.11.2, which has GHSA-xjj6-f33q-929c
  # (high) and two moderate advisories. Same major version; patched in 8.12.2. Remove once jsdom
  # requires 8.12.2 or later itself.
  jsdom>undici: 8.12.2
  # 2026-10-29: @trigger.dev/sdk 4.6.4 → @trigger.dev/core 4.6.4 → @opentelemetry/host-metrics
  # 0.38.3 depends on systeminformation ^5.31.1, resolved to 5.33.15 (GHSA-3f7j-7jwc-fxfj, high:
  # Windows command injection in services() through Unicode quotation marks). Same major; patched
  # in 5.33.16, which still exports the networkStats path host-metrics imports. Remove once
  # host-metrics requires 5.33.16 or later itself.
  "@opentelemetry/host-metrics>systeminformation": 5.33.16
