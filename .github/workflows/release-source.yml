# Pull requests into production must come from main (ADR 0002).
# Separate from ci.yml so it also re-runs when a pull request's target branch is changed
# ("edited"), which keeps a retargeted feature pull request from showing a stale result.
name: Release source

on:
  pull_request:
    branches: [production]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: release-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-source:
    name: Release source
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Only main may be merged into production
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "main" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::Pull requests into production must come from main in this repository (got $HEAD_REPO:$HEAD_REF). See docs/adr/0002-branch-model.md."
            exit 1
          fi
          echo "Release pull request from main: allowed."
