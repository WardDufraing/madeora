# Required checks for every pull request into main or production, and for every push to them.
# The trusted spec guard and the release-source check live in their own workflows.
# Local equivalents of each job are listed in docs/development.md.
name: CI

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]

# Least privilege: jobs can only read the repository. No job uses any secret.
permissions:
  contents: read

# A new push to a pull request cancels its older, superseded run. Push runs are grouped by
# commit, so runs on main and production are never cancelled or dropped from the queue, and
# every commit there keeps a complete result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Synthetic, non-secret values for builds and tests. CI never uses real service configuration.
  APP_ENV: test
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100

# Third-party actions are pinned to full commit SHAs (tag in the comment).
jobs:
  spec-guard:
    name: Spec guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Uses Node built-ins only, so no dependency install (and no install script) runs first.
      - name: Check the product specification is unchanged
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node tools/repo-checks/src/cli/spec-guard.ts --base "$BASE_SHA" --head HEAD
          else
            node tools/repo-checks/src/cli/spec-guard.ts
          fi

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The open-source gitleaks CLI (MIT). GitHub's own secret scanning is not free for private repositories.
      - name: Install gitleaks (checksum verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full Git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high or critical advisories without a recorded exception
        run: pnpm audit:deps

  quality:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Synthetic: the local Supabase stack's address and a made-up publishable key. Nothing
      # in this job contacts Supabase; the build only needs well-formed values.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic-ci-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Client Components must not be able to import server-only settings (real `next build`).
      - run: pnpm test:boundary

  e2e:
    name: E2E smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Installs the Chromium build that matches the pinned @playwright/test version.
      - run: pnpm --filter @madeora/e2e exec playwright install --with-deps chromium
      # Accounts need Supabase Auth: a fresh local stack with only the database, Auth, the API
      # gateway and the mail catcher that Playwright reads confirmation and reset emails from.
      - name: Start a fresh local Supabase stack (Auth and mail catcher)
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Point the app at the local Supabase stack
        run: |
          status="$(pnpm exec supabase status -o env)"
          value() { printf '%s\n' "$status" | sed -n "s/^$1=\"\(.*\)\"$/\1/p"; }
          url="$(value API_URL)"
          key="$(value PUBLISHABLE_KEY)"
          if [ -z "$key" ]; then key="$(value ANON_KEY)"; fi
          if [ -z "$url" ] || [ -z "$key" ]; then echo "supabase status did not report the API URL and key" >&2; exit 1; fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$key"
          } >> "$GITHUB_ENV"
      # Builds the web app first (Turborepo dependency), then runs Playwright against it.
      - run: pnpm test:e2e
      - name: Show Supabase Auth logs when a step fails
        if: failure()
        run: docker logs supabase_auth_madeora --tail 200 || true
      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  e2e-google:
    name: E2E Google sign-in (built Supabase Auth)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @madeora/e2e exec playwright install --with-deps chromium
      # The supabase CLI stack cannot sign in with Google without real Google. The fallback builds
      # Supabase Auth at its pinned commit with the runner's Go (which fetches the toolchain the
      # module asks for), runs it on the runner's PostgreSQL 16 with PostgREST and Mailpit, and
      # points its Google code at the stand-in Google in tests/e2e/scripts/fake-google.ts.
      - name: Check Go and PostgreSQL are available
        run: |
          go version
          test -x /usr/lib/postgresql/16/bin/initdb
      - name: Run the Google sign-in tests
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: pnpm test:e2e:fallback -- --project=google
      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-google
          path: tests/e2e/playwright-report/
          retention-days: 7

  database:
    name: Database and RLS tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The Supabase CLI sends usage data to PostHog unless this is set.
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      # The local stack's database (supabase/config.toml). Synthetic credentials, never a hosted project.
      MADEORA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A fresh runner has no database, so this builds one from scratch: every migration in order,
      # then the synthetic seed. Services the tests do not need are left out.
      - name: Start a fresh local Supabase stack (migrations and seed)
        run: pnpm exec supabase start -x realtime,storage-api,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - name: Run the RLS tests
        run: pnpm test:db
      - name: Check the generated database types match the migrations
        run: pnpm db:types --check
      # Proves the documented reset rebuilds the same database, then tests it again.
      - name: Reset the local database and run the RLS tests again
        run: |
          pnpm db:reset --yes
          pnpm test:db
      - name: Show database logs when a step fails
        if: failure()
        run: docker logs supabase_db_madeora --tail 200 || true
